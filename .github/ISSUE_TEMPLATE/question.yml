name: Question
description: Ask a question about the project.
title: '[Question]: '
labels:
- question
body:
- type: checkboxes
  id: checklist
  attributes:
    label: Before submitting
    options:
    - label: I searched for existing issues.
      required: true
- type: dropdown
  id: areas
  attributes:
    label: Affected Areas
    description: Select all affected areas. Choose Other / Not sure if none fits.
    multiple: true
    options:
    - accessibility
    - activities
    - Calendar and Times
    - entries
    - Google Drive
    - Journal Theme
    - Mail
    - Nebula Theme
    - Normal Theme
    - Notebook
    - pinboard
    - rating
    - scales
    - Sketches
    - Storage
    - Tags
    - Widgets
    - Other / Not sure
  validations:
    required: true
- type: textarea
  id: question
  attributes:
    label: Your Question
    description: What would you like to know?
  validations:
    required: true
