name: Task
description: Improve existing functionality or suggest maintenance and other project work.
type: Task
title: '[Task]: '
body:
- type: checkboxes
  id: checklist
  attributes:
    label: Before submitting
    options:
    - label: I searched for existing issues.
      required: true
- type: dropdown
  id: areas
  attributes:
    label: Affected Areas
    description: Select all affected areas. Choose Other / Not sure if none fits.
    multiple: true
    options:
    - accessibility
    - activities
    - Calendar and Times
    - entries
    - Google Drive
    - Journal Theme
    - Mail
    - Nebula Theme
    - Normal Theme
    - Notebook
    - pinboard
    - rating
    - scales
    - Sketches
    - Storage
    - Tags
    - Widgets
    - Other / Not sure
  validations:
    required: true
- type: textarea
  id: current
  attributes:
    label: Current Situation
    description: What could be improved or needs attention?
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Task / Improvement
    description: What should be changed or done?
  validations:
    required: true
