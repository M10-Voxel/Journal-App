name: Windows builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: EXE and installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-rust-${{ runner.arch }}-
      - run: npm ci
      - run: npm test
      - name: Backend tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build EXE and NSIS installer
        run: npm run tauri build -- --ci
      - name: Name downloads
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $short = '${{ github.sha }}'.Substring(0, 7)
          "label=$version-$short" >> $env:GITHUB_OUTPUT
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Journal-${{ steps.version.outputs.label }}-windows-exe
          path: src-tauri/target/release/journal-app.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Journal-${{ steps.version.outputs.label }}-windows-installer
          path: src-tauri/target/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Download instructions
        shell: pwsh
        run: |
          @'
          ## Journal for Windows
          Download the EXE or installer from **Artifacts** below (GitHub sign-in required).
          These builds are kept for 30 days. Stable signed updates are published separately under **Releases**.
          '@ >> $env:GITHUB_STEP_SUMMARY
