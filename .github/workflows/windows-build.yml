name: Windows builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  # Serialize update publication; a newer push must not interrupt asset uploads.
  cancel-in-progress: ${{ github.ref != 'refs/heads/WIP' }}

jobs:
  windows:
    name: EXE and installer
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      prefix: ${{ steps.plan.outputs.prefix }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-rust-${{ runner.arch }}-
      - run: npm ci
      - name: Prepare build version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release.mjs prepare
      - run: npm test
      - name: Backend tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build test downloads
        if: steps.plan.outputs.publish != 'true'
        run: npm run tauri build -- --ci
      - name: Build and sign app update
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Updater signing secrets are missing.'
          }
          ./scripts/build-release.ps1 -Ci -NotesFile src-tauri/target/ci-release-notes.md
      - name: Stage this build's downloads
        id: downloads
        run: node scripts/ci-release.mjs stage
      - name: Upload EXE
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.plan.outputs.prefix }}-windows-exe
          path: ${{ steps.downloads.outputs.exe }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.plan.outputs.prefix }}-windows-installer
          path: ${{ steps.downloads.outputs.installer }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Download instructions
        shell: pwsh
        run: |
          @'
          ## Journal for Windows
          Download the EXE or installer from **Artifacts** below (GitHub sign-in required).
          Downloads are kept for 30 days. Successful WIP builds are signed and automatically published under **Releases** for the app's update button.
          '@ >> $env:GITHUB_STEP_SUMMARY

  publish:
    name: Publish signed app update
    needs: windows
    if: >-
      needs.windows.outputs.publish == 'true' &&
      github.repository == 'M10-Voxel/Journal-App' &&
      github.ref == 'refs/heads/WIP' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ needs.windows.outputs.prefix }}-windows-*
          merge-multiple: true
          path: src-tauri/target/release/update
      - name: Verify and publish update
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: node scripts/ci-release.mjs publish
      - name: Update download link
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: echo "App update published at $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
