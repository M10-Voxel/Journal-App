<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Journal's logo: a J and nothing behind it. Its stem ends at the top in a bookmark ribbon's notch, its hook in
       a bullet-journal dot; violet into blue (the app's accents), the dot in Nebula's orange. Regenerate the icons
       with: npx tauri icon icon-source.svg -->
  <defs>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="300" y1="90" x2="560" y2="930">
      <stop offset="0" stop-color="#b48cff"/>
      <stop offset=".55" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#3f8cff"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb07a"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>
  <g transform="translate(84 16)">
  <!-- The ribbon top: notched like a bookmark. -->
  <path fill="url(#ink)" d="M560 92 L645 150 L730 92 V260 H560 Z"/>
  <!-- Stem and hook. -->
  <path fill="none" stroke="url(#ink)" stroke-width="170" stroke-linecap="butt" d="M645 240 V600 A215 215 0 0 1 215 600 V585"/>
  <!-- The bullet. -->
  <circle cx="215" cy="395" r="88" fill="url(#dot)"/>
  </g>
</svg>
