[package]
name = "journal-app"
version = "0.1.1"
edition = "2021"
default-run = "journal-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
rfd = "0.17"
imap = "2.4.1"
native-tls = "0.2"
mailparse = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "query", "native-tls"] }
base64 = "0.22"
sha2 = "0.10"
url = "2"
gliner25-rs = { version = "=0.5.6", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

# Reminders as Windows notifications (the same windows crate Tauri already uses).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"
webview2-com = "=0.39.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
